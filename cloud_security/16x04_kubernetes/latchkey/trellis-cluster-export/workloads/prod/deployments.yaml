apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: prod
  labels: &id001
    app: orders-api
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: orders-api-sa
      automountServiceAccountToken: true
      containers:
      - name: app
        image: registry.trellis.internal/prod/orders-api:1.0.0
        securityContext:
          allowPrivilegeEscalation: false
---
