apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: build
  labels: &id001
    app: ci-runner
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: ci-runner
      automountServiceAccountToken: true
      containers:
      - name: app
        image: registry.trellis.internal/build/ci-runner:1.0.0
        securityContext:
          allowPrivilegeEscalation: false
---
