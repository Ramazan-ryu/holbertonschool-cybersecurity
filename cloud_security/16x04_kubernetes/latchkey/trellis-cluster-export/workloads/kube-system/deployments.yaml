apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesystem-app-1
  namespace: kube-system
  labels: &id001
    app: kubesystem-app-1
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: kubesystem-svc-06
      automountServiceAccountToken: true
      containers:
      - name: app
        image: registry.trellis.internal/kube-system/kubesystem-app-1:1.0.0
        securityContext:
          allowPrivilegeEscalation: false
---
