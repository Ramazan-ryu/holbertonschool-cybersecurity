apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: &id001
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: metrics-agent
      automountServiceAccountToken: true
      containers:
      - name: app
        image: registry.trellis.internal/monitoring/prometheus:1.0.0
        securityContext:
          allowPrivilegeEscalation: false
---
